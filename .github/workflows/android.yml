name: Build Study Notes APK

on:
workflow_dispatch:
push:
branches: [main]

jobs:
build:
runs-on: ubuntu-22.04
steps:
- name: Checkout repository
uses: actions/checkout@v4

  - name: Build APK
    uses: docker://ghcr.io/kivy/buildozer:latest
    with:
      args: --workdir /github/workspace buildozer android debug

  - name: Upload APK
    uses: actions/upload-artifact@v4
    with:
      name: StudyAI-APK
      path: bin/*.apk
